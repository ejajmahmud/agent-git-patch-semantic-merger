[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-git-patch-semantic-merger"
version = "0.1.0"
description = "Three-way semantic AST merge resolver automatically resolving git conflict markers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-git-patch-semantic-merger = "agent_git_patch_semantic_merger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_git_patch_semantic_merger*"]
